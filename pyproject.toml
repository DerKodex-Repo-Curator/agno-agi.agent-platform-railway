[project]
name = "agent-platform"
version = "1.0.0"
description = "Self-driving agent platform built using Agno."
requires-python = ">=3.12,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  # Alpha pin for the v2.7 MCP/auth surface (8-tool MCP server, continue_run over
  # MCP, service-account PATs). Loosen to `agno[os,slack]` at 2.7 stable.
  "agno[os,slack]==2.7.0a1",
  "fastapi[standard]",
  # AgentOS MCP server (enable_mcp_server=True) imports fastmcp; no agno extra ships it.
  "fastmcp",
  "mcp",
  "openai",
  "parallel-web",
  "pgvector",
  "psycopg[binary]",
  "pyyaml",
  "sqlalchemy",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "evals*", "workflows*"]

[tool.ruff]
line-length = 120
exclude = [".venv*"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "agno.*", "httpx.*", "mcp.*", "sqlalchemy.*", "fastapi.*"]
ignore_missing_imports = true

[tool.uv.pip]
no-annotate = true
